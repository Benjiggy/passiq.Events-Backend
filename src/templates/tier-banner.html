<div class="tier-banner-box">
  <img
    src="{{tierImageUrl}}"
    alt="{{tierName}} Pass Artwork"
    class="tier-banner-img"
  />
  <div class="tier-banner-caption">
    <span style="color: #ffffff; font-weight: 700">{{tierName}}</span>
    <span style="color: #ccff00; font-weight: 800"
      >{{ticketCountText}} Issued</span
    >
  </div>
</div>
